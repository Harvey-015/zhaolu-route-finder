name: 缺陷报告
description: 报告可重复的软件错误
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。请删除 Key、Token、精确位置、完整路线几何和真实用户数据。安全漏洞请按 SECURITY.md 私下报告。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我搜索过现有 Issue，没有发现相同问题
          required: true
        - label: 这不是需要私下报告的安全漏洞
          required: true
        - label: 我已经删除所有凭据和个人敏感信息
          required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit SHA
      placeholder: v0.1.0 或完整 commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响区域
      options:
        - Web UI
        - 路线推荐核心
        - 地点或路线 Provider
        - 环境数据 Provider
        - API 或数据存储
        - 部署、监控或备份
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node/浏览器版本、运行方式；不要粘贴环境变量值。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 使用 Fixture 或匿名测试位置……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图
      description: 只提供最小必要证据；不要粘贴第三方原始响应。
