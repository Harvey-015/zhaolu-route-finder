name: 功能建议
description: 建议产品、API、算法或开发体验改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我搜索过现有 Issue 和 Roadmap
          required: true
        - label: 我阅读过架构边界，理解 Provider 应保持解耦
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户或开发者遇到的具体问题，不要只描述方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性和迁移
      description: 是否影响公共 API、算法 Profile、数据存储、坐标系或现有 Provider？
  - type: textarea
    id: risks
    attributes:
      label: 安全、隐私、合规和成本
      description: 是否引入外部服务、用户数据、费用、额度或新的许可证义务？
