name: release-readiness

on:
  workflow_dispatch:
    inputs:
      evidence_path:
        description: Committed release evidence JSON path
        required: true
        default: release/evidence.json
        type: string
      maximum_evidence_age_days:
        description: Maximum age for dynamic gate evidence
        required: true
        default: "14"
        type: string

permissions:
  contents: read

concurrency:
  group: release-readiness
  cancel-in-progress: false

jobs:
  go-no-go:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:check
        env:
          RELEASE_EVIDENCE_FILE: ${{ inputs.evidence_path }}
          RELEASE_EVIDENCE_MAX_AGE_DAYS: ${{ inputs.maximum_evidence_age_days }}
