global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/zhaolu.rules.yaml

scrape_configs:
  - job_name: zhaolu
    scheme: https
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/zhaolu-observability-token
    static_configs:
      - targets:
          - routes.example.com

  # This job expects a separately deployed Prometheus blackbox exporter.
  - job_name: zhaolu-ready
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://routes.example.com/api/v1/ready
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
